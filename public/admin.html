<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Operations | Houston Roofing &amp; Construction</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="disclaimer-banner">Administrative Operations Console</div>

  <header class="glass-nav">
    <div class="container nav-inner">
      <span class="wordmark">Houston Roofing Admin Console</span>
      <nav class="nav-links">
        <a href="/dashboard.html">User Portal</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 40px;">
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 32px;">
      <div>
        <h2>Appointments &amp; Project Conversions</h2>
        <div id="adminAppointments" style="margin-top: 16px;">Loading appointments...</div>

        <h2 style="margin-top: 40px;">Active Work Orders</h2>
        <div id="adminProjects" style="margin-top: 16px;">Loading projects...</div>
      </div>

      <!-- Action Panel -->
      <div>
        <div class="card-service">
          <h3>Broadcast Announcement</h3>
          <div class="form-group" style="margin-top: 12px;">
            <label>Title</label>
            <input type="text" id="announceTitle" placeholder="Storm Advisory">
          </div>
          <div class="form-group">
            <label>Body</label>
            <textarea id="announceBody" rows="3" placeholder="Hail reported in Cypress area..."></textarea>
          </div>
          <div class="form-group">
            <label>Severity</label>
            <select id="announceSeverity">
              <option value="info">Info</option>
              <option value="storm">Storm Alert</option>
              <option value="promo">Notice</option>
            </select>
          </div>
          <button id="btnPublishAnnounce" class="btn-clay" style="width: 100%;">Publish Banner</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { observeAuth } from '/js/auth.js';

    observeAuth(user => {
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      loadAdminData();
    });

    async function loadAdminData() {
      const res = await fetch('/api/admin/overview');
      if (res.status === 403) {
        alert('Access denied. Administrator privileges required.');
        window.location.href = '/dashboard.html';
        return;
      }
      const data = await res.json();

      const apptEl = document.getElementById('adminAppointments');
      apptEl.innerHTML = '';
      data.appointments.forEach(a => {
        const card = document.createElement('div');
        card.className = 'card-service';
        card.style.marginBottom = '12px';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between;">
            <div>
              <strong>${a.serviceType}</strong> (${a.status})
              <p>${new Date(a.startAt).toLocaleString()} - ${a.address.street}</p>
            </div>
            <div>
              <button class="btn-secondary" onclick="promoteToProject('${a.id}', '${a.uid}', '${a.serviceType}')">Create Project</button>
            </div>
          </div>
        `;
        apptEl.appendChild(card);
      });

      const projEl = document.getElementById('adminProjects');
      projEl.innerHTML = '';
      data.projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card-service';
        card.style.marginBottom = '12px';
        card.innerHTML = `
          <strong>${p.title}</strong>
          <p>Stage: ${p.stageLabel || p.stageKey}</p>
          <div style="margin-top: 8px; display:flex; gap:8px;">
            <button class="btn-secondary" onclick="advanceStage('${p.id}', 'permits-materials', 'Permits & Materials Ordered')">Order Materials</button>
            <button class="btn-secondary" onclick="advanceStage('${p.id}', 'in-progress', 'Tear-Off / Crew On Site')">Start Crew</button>
            <button class="btn-secondary" onclick="advanceStage('${p.id}', 'complete', 'Final Inspection Complete')">Complete</button>
          </div>
        `;
        projEl.appendChild(card);
      });
    }

    window.promoteToProject = async (appointmentId, uid, serviceType) => {
      const title = prompt('Enter Project Title:', 'Roof Replacement - ' + serviceType);
      if (!title) return;
      const res = await fetch('/api/admin/projects', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ appointmentId, uid, title, serviceType })
      });
      if (res.ok) loadAdminData();
    };

    window.advanceStage = async (id, stageKey, stageLabel) => {
      const note = prompt('Customer Notification Note for ' + stageLabel + ':', 'Project updated to ' + stageLabel);
      if (note === null) return;
      const res = await fetch(`/api/admin/projects/${id}/advance`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stageKey, stageLabel, note, visibleToCustomer: true })
      });
      if (res.ok) loadAdminData();
    };

    document.getElementById('btnPublishAnnounce').addEventListener('click', async () => {
      const title = document.getElementById('announceTitle').value;
      const body = document.getElementById('announceBody').value;
      const severity = document.getElementById('announceSeverity').value;

      if (!title || !body) return alert('Fill title and body');

      const res = await fetch('/api/admin/announcements', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, body, severity })
      });

      if (res.ok) {
        alert('Published successfully.');
        document.getElementById('announceTitle').value = '';
        document.getElementById('announceBody').value = '';
      }
    });
  </script>
</body>
</html>
