<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Customer Login | Houston Roofing &amp; Construction</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="disclaimer-banner">Design concept, not the official website.</div>

  <header class="glass-nav">
    <div class="container nav-inner">
      <a href="/" class="wordmark">Houston Roofing &amp; Construction</a>
      <nav class="nav-links">
        <a href="/book.html" class="btn-clay">Book Inspection</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="wizard-box" style="text-align: center; max-width: 440px;">
      <h2>Sign In to Project Portal</h2>
      <p style="color: var(--text-muted); margin: 12px 0 24px;">Track appointment bookings, job status updates, and milestone inspection photos.</p>
      
      <button id="btnGoogleLogin" class="btn-clay" style="width: 100%;">
        Sign In with Google
      </button>

      <div id="loginStatus" style="margin-top: 16px; color: var(--status-storm); font-size: 0.9rem;"></div>
    </div>
  </main>

  <script type="module">
    import { loginWithGoogle, observeAuth } from '/js/auth.js';

    observeAuth(user => {
      if (user) {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || 'dashboard.html';
        window.location.href = `/${redirect}`;
      }
    });

    document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
      const statusEl = document.getElementById('loginStatus');
      statusEl.textContent = 'Contacting authentication provider...';
      try {
        await loginWithGoogle();
        const params = new URLSearchParams(window.location.search);
        window.location.href = `/${params.get('redirect') || 'dashboard.html'}`;
      } catch (err) {
        statusEl.textContent = err.message || 'Login failed. Please retry.';
      }
    });
  </script>
</body>
</html>
