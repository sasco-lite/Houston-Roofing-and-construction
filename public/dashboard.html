<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Customer Dashboard | Houston Roofing &amp; Construction</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="disclaimer-banner">Design concept, not the official website.</div>

  <header class="glass-nav">
    <div class="container nav-inner">
      <a href="/" class="wordmark">Houston Roofing &amp; Construction</a>
      <nav class="nav-links">
        <a href="/book.html" class="btn-clay">New Booking</a>
        <button id="btnLogout" class="btn-secondary" style="padding: 8px 16px;">Sign Out</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: 40px;">
    <h1>Project &amp; Inspection Dashboard</h1>
    <p style="color: var(--text-muted); margin-bottom: 32px;">Real-time status updates and scheduled field assessments.</p>

    <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 32px;">
      <!-- Appointments List -->
      <div>
        <h2>Your Appointments</h2>
        <div id="appointmentsList" style="margin-top: 16px;">Loading scheduled appointments...</div>
      </div>

      <!-- Active Projects & Timeline -->
      <div>
        <h2>Active Project Milestones</h2>
        <div id="projectsList" style="margin-top: 16px;">Loading project stages...</div>
      </div>
    </div>
  </main>

  <script type="module">
    import { observeAuth, logoutUser } from '/js/auth.js';

    document.getElementById('btnLogout').addEventListener('click', logoutUser);

    observeAuth(user => {
      if (!user) {
        window.location.href = '/login.html?redirect=dashboard.html';
        return;
      }
      loadDashboard();
    });

    async function loadDashboard() {
      try {
        const res = await fetch('/api/my-dashboard');
        if (!res.ok) throw new Error('Failed to load dashboard data');
        const data = await res.json();

        // Render Appointments
        const apptContainer = document.getElementById('appointmentsList');
        apptContainer.innerHTML = '';
        if (data.appointments.length === 0) {
          apptContainer.innerHTML = '<p style="color: var(--text-muted);">No scheduled appointments found.</p>';
        } else {
          data.appointments.forEach(a => {
            const el = document.createElement('div');
            el.className = 'card-service';
            el.style.marginBottom = '16px';
            el.innerHTML = `
              <div>
                <strong>${a.serviceType}</strong>
                <p style="margin: 4px 0;">${new Date(a.startAt).toLocaleString()}</p>
                <p style="font-size: 0.85rem; color: var(--text-muted);">${a.address.street}, ${a.address.zip}</p>
                <p>Status: <span style="font-weight:600; color: ${a.status === 'confirmed' ? 'var(--status-confirmed)' : 'var(--status-storm)'}">${a.status}</span></p>
              </div>
              ${a.status === 'confirmed' ? `<button class="btn-secondary" style="margin-top:12px;" onclick="cancelAppt('${a.id}')">Cancel Appointment</button>` : ''}
            `;
            apptContainer.appendChild(el);
          });
        }

        // Render Projects
        const projContainer = document.getElementById('projectsList');
        projContainer.innerHTML = '';
        if (data.projects.length === 0) {
          projContainer.innerHTML = '<p style="color: var(--text-muted);">No active projects currently provisioned.</p>';
        } else {
          data.projects.forEach(p => {
            const pCard = document.createElement('div');
            pCard.className = 'card-service';
            pCard.style.marginBottom = '24px';
            
            let timelineHtml = '<div class="timeline" style="margin-top:20px;">';
            (p.events || []).forEach(e => {
              timelineHtml += `
                <div class="timeline-item">
                  <div class="timeline-badge clay"></div>
                  <strong>${e.title}</strong>
                  <div style="font-size:0.8rem; color:var(--text-muted);">${new Date(e.timestamp).toLocaleDateString()}</div>
                  <p style="margin-top:4px;">${e.note}</p>
                </div>
              `;
            });
            timelineHtml += '</div>';

            pCard.innerHTML = `
              <h3>${p.title}</h3>
              <p>Current Phase: <strong>${p.stageLabel || p.stageKey}</strong></p>
              ${timelineHtml}
            `;
            projContainer.appendChild(pCard);
          });
        }
      } catch (err) {
        alert(err.message);
      }
    }

    window.cancelAppt = async (id) => {
      if (!confirm('Are you sure you want to cancel this appointment?')) return;
      const res = await fetch(`/api/appointments/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'cancel' })
      });
      if (res.ok) {
        loadDashboard();
      } else {
        const err = await res.json();
        alert(err.error || 'Cancellation disallowed.');
      }
    };
  </script>
</body>
</html>
